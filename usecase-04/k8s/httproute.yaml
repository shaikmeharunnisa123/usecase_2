apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claims-route
  namespace: claims-k8s-lab
spec:
  parentRefs:
    - name: claims-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: claims-backend
          port: 5000

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: claims-frontend
          port: 80